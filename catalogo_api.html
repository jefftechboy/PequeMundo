<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo API de Muebles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
      padding: 30px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 30px;
    }

    .titulo h1 {
      font-size: 2.2rem;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .titulo p {
      color: #666;
      font-size: 1rem;
    }

    .contenedor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #ddd;
    }

    .card-body {
      padding: 18px;
    }

    .card-body h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #1f2d3d;
    }

    .descripcion {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 12px;
      min-height: 40px;
    }

    .precio {
      font-size: 1.2rem;
      font-weight: bold;
      color: #27ae60;
      margin-bottom: 10px;
    }

    .info {
      font-size: 0.9rem;
      color: #444;
      line-height: 1.5;
    }

    .mensaje {
      text-align: center;
      font-size: 1rem;
      color: #888;
      margin-top: 30px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
      margin-top: 10px;
      background: #eafaf1;
      color: #1e8449;
    }

    .sin-imagen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 220px;
      background: #e5e7eb;
      color: #555;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="titulo">
    <h1>Catálogo de Muebles</h1>
    <p>Visualización de productos consumidos desde la API REST</p>
  </div>

  <div id="contenedor" class="contenedor"></div>
  <div id="mensaje" class="mensaje"></div>

  <script>
    const API_URL = "http://127.0.0.1:8001/muebles";
    const MEDIA_BASE = "http://127.0.0.1:8000";
    const contenedor = document.getElementById("contenedor");
    const mensaje = document.getElementById("mensaje");

    function formatearPrecio(precio) {
      return new Intl.NumberFormat("es-CL").format(precio);
    }

    async function cargarMuebles() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("No se pudo obtener el catálogo");
        }

        const muebles = await response.json();

        if (muebles.length === 0) {
          mensaje.textContent = "No hay muebles registrados.";
          return;
        }

        muebles.forEach(mueble => {
          const card = document.createElement("div");
          card.className = "card";

          const imagenHtml = mueble.foto
            ? `<img src="${MEDIA_BASE}${mueble.foto}" alt="${mueble.nombre}">`
            : `<div class="sin-imagen">Sin imagen</div>`;

          card.innerHTML = `
            ${imagenHtml}
            <div class="card-body">
              <h2>${mueble.nombre}</h2>
              <p class="descripcion">${mueble.descripcion}</p>
              <p class="precio">$${formatearPrecio(mueble.precio)}</p>
              <div class="info">
                <p><strong>ID:</strong> ${mueble.id}</p>
                <p><strong>Cantidad:</strong> ${mueble.cantidad}</p>
                <p><strong>Estado:</strong> ${mueble.estado}</p>
                <p><strong>Disponibilidad:</strong> ${mueble.disponiblidad}</p>
                <p><strong>Categoría:</strong> ${mueble.categoria_mueble}</p>
              </div>
              <span class="badge">Producto API</span>
            </div>
          `;

          contenedor.appendChild(card);
        });

      } catch (error) {
        mensaje.textContent = "Error al cargar el catálogo desde la API.";
        console.error(error);
      }
    }

    cargarMuebles();
  </script>

</body>
</html>
