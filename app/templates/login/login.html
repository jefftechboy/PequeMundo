{% load static %}

{% include 'base/navbar.html' %}
    {% block content %}
        <section class="login-panel">
            <h1 id="authTitle">Iniciar sesión</h1>
            <p id="authDescription">Accede a tu cuenta para seguir comprando, ver pedidos y experiencias personalizadas.</p>
            <form id="loginForm" method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Nombre Usuario</label>
                    <input id="username" name="username" type="text" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
            <button class="btn-primary">
                <a  href="{% url 'IDpaginaCrearCuenta' %}" style="text-decoration-line: none;color: white;">Crear cuenta</a>
            </button>
        </section>
        {% if error %}
            <p>{{ error }}</p>
        {% endif %}
    {% endblock %}
{% include 'base/footer.html' %}
