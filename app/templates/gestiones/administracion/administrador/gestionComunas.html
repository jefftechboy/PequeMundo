{% load static %}

{% include 'gestiones/baseGestion/navbarGestion.html' %}

<div class="container mt-4">
    <a href="{% url 'IDpaginaGestionCrearComuna' %}">
        <button class="btn btn-success" style="margin-bottom: 10px;">
            Crear Comuna
        </button>
    </a>
    <table class="table table-dark table-striped table-hover">

        <thead>
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Editar</th>
            </tr>
        </thead>

        <tbody>

            {% for comuna in comunas %}

                <tr>
                    <td>{{ comuna.id }}</td>
                    <td>{{ comuna.descripcion }}</td>
                    <td>
                        <a href="{% url 'IDpaginaGestionEditarComuna' comuna.id %}" class="btn btn-warning btn-sm">
                            Editar
                        </a>
                    </td>
                </tr>

            {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No hay comunas registradas.</td>
                </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% include 'gestiones/baseGestion/footerGestion.html' %}
