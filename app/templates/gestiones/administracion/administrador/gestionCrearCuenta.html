{% load static %}

{% include 'gestiones/baseGestion/navbarGestion.html' %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow"
                 style="background-color:#2a2218; border-color:#5a4614;">

                <div class="card-header"
                     style="background-color:#342a1d; border-bottom-color:#5a4614;">
                    <h4 class="mb-0 text-light">
                        Crear Nuevo Mueble
                    </h4>
                </div>

                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Usuario
                            </label>
                            {{ formulario_de_usuario.username }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Contraseña
                            </label>
                            {{ formulario_de_usuario.password1 }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">
                                Confirmar contraseña
                            </label>
                            {{ formulario_de_usuario.password2 }}
                        </div>

                        <button type="submit" class="btn btn-success">
                            Crear cuenta
                        </button>
                        <a href="{% url 'IDpaginaGestionUsuarios' %}" class="btn btn-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>

            </div>

        </div>
    </div>
</div>
{% include 'gestiones/baseGestion/footerGestion.html' %}
