{% load static %}

{% include 'gestiones/baseGestion/navbarGestion.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card" style="background-color: #2a2218; border-color: #5a4614;">
                <div class="card-header" style="background-color: #342a1d; border-bottom-color: #5a4614;">
                    <h5 class="mb-0" style="color: #fff5d6;">Editar Estado de Producto Comprado</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_descripcion" class="form-label" style="color: #fff5d6;">Descripción</label>
                            <input type="text" class="form-control" id="username" name="username" value="{{ usuario.username }}" placeholder="Ingrese el estado del producto" required style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                        </div>
                        <div class="mb-3">
                            <label for="id_descripcion" class="form-label" style="color: #fff5d6;">Constraseña nueva</label>
                            <input type="text" class="form-control" id="password1" name="password1" value="{{ usuario.password }}" placeholder="Ingresa nueva contraseña" required style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                        </div>
                        <div class="mb-3">
                            <label for="id_descripcion" class="form-label" style="color: #fff5d6;">Constraseña nueva</label>
                            <input type="text" class="form-control" id="password2" name="password2" value="{{ usuario.password}}" placeholder="Ingresa nueva contraseña" required style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                        </div>
                        <div class="mb-3">
                            <label>Grupo</label>
                            <select name="grupo" class="form-select">
                                {% for grupo in grupos %}
                                    <option value="{{ grupo.id }}"
                                        {% if grupo in usuario.groups.all %}selected{% endif %}>
                                        {{ grupo.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                            <a href="{% url 'IDpaginaGestionUsuarios' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'gestiones/baseGestion/footerGestion.html' %}
