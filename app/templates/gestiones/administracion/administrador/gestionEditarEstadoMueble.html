{% load static %}

{% include 'gestiones/baseGestion/navbarGestion.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card" style="background-color: #2a2218; border-color: #5a4614;">
                <div class="card-header" style="background-color: #342a1d; border-bottom-color: #5a4614;">
                    <h5 class="mb-0" style="color: #fff5d6;">Editar Estado de Mueble</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_descripcion" class="form-label" style="color: #fff5d6;">Descripción</label>
                            <input type="text" class="form-control" id="id_descripcion" name="descripcion" value="{{ estado.descripcion }}" placeholder="Ingrese el estado del mueble" required style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                            <a href="{% url 'IDpaginaGestionEstadosMuebles' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% include 'gestiones/baseGestion/footerGestion.html' %}
