{% load static %}
    {% include 'gestiones/baseGestion/navbarGestion.html' %}
        {% block content %}
            <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card" style="background-color: #2a2218; border-color: #5a4614;">
                        <div class="card-header" style="background-color: #342a1d; border-bottom-color: #5a4614;">
                            <h5 class="mb-0" style="color: #fff5d6;">Crear Nuevo Mueble</h5>
                        </div>
                        <div class="card-body">
                            <form method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
        
                                <!-- Nombre -->
                                <div class="mb-3">
                                    <label for="id_nombre" class="form-label" style="color: #fff5d6;">
                                        Nombre
                                    </label>
                                    <input type="text"
                                        class="form-control"
                                        value="{{ muebleDatos.nombre }}"
                                        id="id_nombre"
                                        name="nombre"
                                        required
                                        style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                                </div>
        
                                <!-- Descripción -->
                                <div class="mb-3">
                                    <label for="id_descripcion" class="form-label" style="color: #fff5d6;">
                                        Descripción
                                    </label>
                                    <input type="text"
                                        class="form-control"
                                        id="id_descripcion"
                                        name="descripcion"
                                        value="{{ muebleDatos.descripcion }}"
                                        required
                                        style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                                </div>
        
                                <!-- Foto -->
                                <div class="mb-3">
                                    <label for="id_foto" class="form-label" style="color: #fff5d6;">
                                        Foto
                                    </label>
                                    <input type="file"
                                        class="form-control"
                                        id="id_foto"
                                        name="foto"
                                        value="{{ muebleDatos.foto }}"
                                        accept="image/*"
                                        style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                                </div>
        
                                <!-- Precio -->
                                <div class="mb-3">
                                    <label for="id_precio" class="form-label" style="color: #fff5d6;">
                                        Precio
                                    </label>
                                    <input type="number"
                                        class="form-control"
                                        id="id_precio"
                                        name="precio"
                                        min="0"
                                        value="{{ muebleDatos.precio }}"
                                        required
                                        style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                                </div>
        
                                <!-- Cantidad -->
                                <div class="mb-3">
                                    <label for="id_cantidad" class="form-label" style="color: #fff5d6;">
                                        Cantidad
                                    </label>
                                    <input type="number"
                                        class="form-control"
                                        id="id_cantidad"
                                        name="cantidad"
                                        min="0"
                                        value="0"
                                        required
                                        value="{{ muebleDatos.cantidad }}"
                                        style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
                                </div>
        
                                <!-- Estado -->
                                <div class="mb-3">
                                    <label for="id_estado" class="form-label" style="color: #fff5d6;">
                                        Estado
                                    </label>
                                    <select class="form-select"
                                            id="id_estado"
                                            name="estado"
                                            required
                                            style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
        
                                        {% for estado in estados %}
                                            <option value="{{ estado.id }}">
                                                {{ estado.descripcion }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
        
                                <!-- Disponibilidad -->
                                <div class="mb-3">
                                    <label for="id_disponiblidad" class="form-label" style="color: #fff5d6;">
                                        Disponibilidad
                                    </label>
                                    <select class="form-select"
                                            id="id_disponiblidad"
                                            name="disponiblidad"
                                            required
                                            style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
        
                                        {% for disponibilidad in disponibilidades %}
                                            <option value="{{ disponibilidad.id }}">
                                                {{ disponibilidad.descripcion }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
        
                                <!-- Categoría -->
                                <div class="mb-3">
                                    <label for="id_categoria_mueble" class="form-label" style="color: #fff5d6;">
                                        Categoría
                                    </label>
                                    <select class="form-select"
                                            id="id_categoria_mueble"
                                            name="categoria_mueble"
                                            required
                                            style="background-color: #473825; border-color: #5a4614; color: #fff5d6;">
        
                                        {% for categoria in categorias %}
                                            <option value="{{ categoria.id }}">
                                                {{ categoria.descripcion }}
                                            </option>
                                        {% endfor %}
                                    </select>
                                </div>
        
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-success">
                                        Guardar
                                    </button>
        
                                    <a href="{% url 'IDpaginaGestionMuebles' %}" class="btn btn-secondary">
                                        Cancelar
                                    </a>
                                </div>
        
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        {% endblock %}
    {% include 'gestiones/baseGestion/footerGestion.html' %}
